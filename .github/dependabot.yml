version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      timezone: America/Boise
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      effect-toolchain:
        patterns:
          [
            "effect",
            "@effect/*",
            "alchemy",
            "@alchemy.run/*",
            "*foldkit*",
            "typescript",
            "oxlint",
            "oxlint-tsgolint",
            "@typescript/native-preview",
          ]
        update-types: [minor, patch]
      regular:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
