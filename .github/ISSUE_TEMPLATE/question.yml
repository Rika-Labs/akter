name: Question
description: Ask about using or operating the open-source framework or CLI
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the Akter version, relevant runtime/database versions, and a small example if useful. Do not include secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you checked?
      description: Link the documentation you read and describe what you've tried.
