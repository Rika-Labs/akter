name: Set up the workspace
description: Install the pinned Bun and Node toolchains and the frozen dependencies, then patch the compiler the way `bun run prepare` does.
inputs:
  save-cache:
    description: Save the Bun package cache when the exact key missed. One job per workflow saves it; the others only restore.
    default: "false"
  typecheck-cache:
    description: Restore and save the incremental typecheck state.
    default: "false"
  turbo-team:
    description: Turborepo remote cache team. Leave empty to run without the remote cache.
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    # oxlint's CLI runs on Node; Node < 24 cannot load the .ts JS plugins.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.7.0
        package-manager-cache: false
    - name: Restore Bun package cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
    - name: Restore and save Bun package cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
    - name: Restore incremental typecheck state
      if: inputs.typecheck-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/.cache/typecheck.tsbuildinfo
        key: types-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'tsconfig.json', '**/tsconfig.json') }}-${{ github.sha }}
    - name: Set up Turborepo Remote Cache
      if: >-
        inputs.turbo-team != '' &&
        github.actor != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      with:
        team: ${{ inputs.turbo-team }}
    - name: Install dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile --ignore-scripts
        bun run prepare
