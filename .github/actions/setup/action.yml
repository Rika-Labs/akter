name: Set up the workspace
description: Install the pinned Bun and Node toolchains and frozen dependencies, restore the Bun package cache on GitHub-hosted runners, then patch the compiler the way `bun run prepare` does.
inputs:
  save-cache:
    description: On GitHub-hosted runners, save the Bun package cache when the exact key missed. One job per workflow saves it; the others only restore.
    default: "false"
  typecheck-cache:
    description: Restore and save incremental typecheck state for the exact commit.
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    # oxlint's CLI runs on Node; Node < 24 cannot load the .ts JS plugins.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 26.7.0
        package-manager-cache: false
    - name: Restore Bun package cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
    - name: Restore and save Bun package cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
    - name: Restore incremental typecheck state
      if: inputs.typecheck-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          **/.cache/typecheck.tsbuildinfo
        key: types-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'tsconfig.json', '**/tsconfig.json') }}-${{ github.sha }}
    - name: Install dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile --ignore-scripts
        bun run prepare
