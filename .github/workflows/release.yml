name: Release
on:
  push:
    tags: ["v*"]
    branches: [rewrite/0.2]
  workflow_run:
    workflows: [Verify]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0-alpha.1"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      release-tag: ${{ steps.release.outputs.release_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CANARY: ${{ github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref_type == 'branch') }}
      CANARY_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event_name == 'push' && github.ref_type == 'branch' && github.sha) || format('refs/tags/{0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - name: Install npm with trusted publishing and dist-tag support
        run: |
          set -euo pipefail
          npm install --global npm@12.2.0
          npm="$(npm --version)"
          test "$npm" = 12.2.0
          echo "node $(node --version), npm $npm"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Select a verified canary or tagged release
        id: release
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          branch=main
          channel=()
          if [ "$CANARY" = true ]; then
            branch="$CANARY_BRANCH"
            channel=(--canary-branch "$branch")
          fi
          bun .github/src/release/version.ts "${channel[@]}" > "$RUNNER_TEMP/release-channel"
          git merge-base --is-ancestor "$commit" "origin/$branch" || { echo "$commit is not on $branch"; exit 1; }
          test "$commit" = "$GITHUB_SHA" || { echo "Checkout does not match the provenance SHA; dispatch on the matching tag ref"; exit 1; }
          if [ "$CANARY" = true ]; then
            cat "$RUNNER_TEMP/release-channel" >> "$GITHUB_OUTPUT"
            echo "Publishing a $(sed -n 's/^tag=//p' "$RUNNER_TEMP/release-channel") canary from verified commit $commit on $branch"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9] ]] || { echo "$RELEASE_TAG is not a v<version> tag"; exit 1; }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || { echo "Tag $RELEASE_TAG does not exist"; exit 1; }
          test "$commit" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" || { echo "Checkout is not $RELEASE_TAG"; exit 1; }
          version="$(jq -r .version packages/akter/package.json)"
          test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not match version $version"; exit 1; }
          core="${version%%+*}"
          cat "$RUNNER_TEMP/release-channel" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$core" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Wait for a successful Verify run on the pushed commit
        if: github.event_name == 'push' && github.ref_type == 'branch'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          for _ in $(seq 1 120); do
            states="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&event=push&branch=${CANARY_BRANCH}&per_page=100" \
              --jq '.workflow_runs[] | if .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failed" end')"
            if grep -qx success <<<"$states"; then
              echo "Verify succeeded for $commit on $CANARY_BRANCH"
              exit 0
            fi
            if [ -n "$states" ] && ! grep -qx pending <<<"$states"; then
              echo "Verify did not succeed for $commit" >&2
              exit 1
            fi
            sleep 15
          done
          echo "No finished Verify run for $commit within the wait" >&2
          exit 1
      - name: Require a successful Verify run for the tagged commit
        if: env.CANARY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          runs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .status == "completed") | .id')"
          if [[ -z "$runs" ]]; then
            echo "No successful Verify run found for $commit" >&2
            exit 1
          fi
          echo "Successful Verify run(s) for $commit: ${runs//$'\n'/, }"
      - name: Build, stage and check the tarball
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          bun --bun node_modules/vitest/vitest.mjs run .github/src/release/notes.test.ts .github/src/release/version.test.ts
          canary=()
          if [ "$CANARY" = true ]; then
            commit="$(git rev-parse HEAD)"
            canary=(--canary "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.g${commit:0:12}" --canary-channel "$DIST_TAG")
          else
            bun .github/src/release/notes.ts "$(jq -r .version packages/akter/package.json)" > "$RUNNER_TEMP/release-notes.md"
          fi
          bun run prepare
          bun .github/src/pack.ts --out "$RUNNER_TEMP/package" --cli-out "$RUNNER_TEMP/package-cli" "${canary[@]}"
          npm publish "$RUNNER_TEMP/package-cli" --dry-run --ignore-scripts --access public --tag "$DIST_TAG"
      - name: Install the tarballs into a clean project and run them on Node and Bun
        run: |
          SMOKE_RUNTIME=node bun .github/src/release/smoke.ts --package "$RUNNER_TEMP/package" --cli-package "$RUNNER_TEMP/package-cli"
          SMOKE_RUNTIME=bun bun .github/src/release/smoke.ts --package "$RUNNER_TEMP/package" --cli-package "$RUNNER_TEMP/package-cli"
      - name: Publish through npm trusted publishing
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP/package" "$RUNNER_TEMP/package-cli"; do
            name="$(jq -r .name "$package/package.json")"
            version="$(jq -r .version "$package/package.json")"
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" != "$version" ]; then
              npm publish "$package" --provenance --access public --tag "$DIST_TAG"
            else
              echo "$name@$version is already on npm; skipping the immutable publish"
            fi
          done
      - name: Promote pre-1.0 releases to latest
        if: steps.release.outputs.promote_latest == 'true'
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP/package" "$RUNNER_TEMP/package-cli"; do
            name="$(jq -r .name "$package/package.json")"
            version="$(jq -r .version "$package/package.json")"
            current="$(npm view "$name" dist-tags --json | jq -r 'if type == "array" then .[0] else . end | .latest // empty')"
            if [ -z "$current" ] || bun -e 'process.exit(Bun.semver.order(Bun.argv[1], Bun.argv[2]) < 0 ? 1 : 0)' "$version" "$current"; then
              npm dist-tag add "$name@$version" latest
            else
              echo "$name latest is already newer ($current); leaving it unchanged"
            fi
          done
      - name: Upload the validated release notes
        if: env.CANARY != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  github-release:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.release-tag }}
      PRERELEASE: ${{ needs.publish.outputs.prerelease }}
    steps:
      - name: Download the validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file "$notes" --prerelease="$PRERELEASE"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE"
          fi
