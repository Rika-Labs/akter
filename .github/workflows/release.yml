name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0-alpha.1"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      release-tag: ${{ steps.release.outputs.release_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          npm="$(npm --version)"
          printf '%s\n%s\n' 11.5.1 "$npm" | sort -V -C || { echo "npm $npm is older than 11.5.1, which trusted publishing needs"; exit 1; }
          echo "node $(node --version), npm $npm"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check the tag names a released commit on main
        id: release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9] ]] || { echo "$RELEASE_TAG is not a v<version> tag"; exit 1; }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || { echo "Tag $RELEASE_TAG does not exist"; exit 1; }
          commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit" || { echo "Checkout is not $RELEASE_TAG"; exit 1; }
          version="$(jq -r .version packages/akter/package.json)"
          test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not match version $version"; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main || { echo "$commit is not on main"; exit 1; }
          core="${version%%+*}"
          if [[ "$core" == *-* ]]; then tag="${core#*-}"; tag="${tag%%.*}"; else tag=latest; fi
          [[ "$tag" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Prerelease id of $version is not a dist-tag name"; exit 1; }
          name="$(jq -r .name packages/akter/package.json)"
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "$name@$version is already on npm (a hand-published bootstrap or a rerun); publishing is skipped"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $version from $commit to dist-tag $tag"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$core" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Require a successful Verify run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          runs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .status == "completed") | .id')"
          if [[ -z "$runs" ]]; then
            echo "No successful Verify run found for $commit" >&2
            exit 1
          fi
          echo "Successful Verify run(s) for $commit: ${runs//$'\n'/, }"
      - name: Build, stage and check the tarball
        run: |
          bun --bun node_modules/vitest/vitest.mjs run .github/src/release/notes.test.ts
          bun .github/src/release/notes.ts "$(jq -r .version packages/akter/package.json)" > "$RUNNER_TEMP/release-notes.md"
          bun run prepare
          bun .github/src/pack.ts --out "$RUNNER_TEMP/package"
      - name: Install the tarball into a clean project and run it
        run: bun .github/src/release/smoke.ts --package "$RUNNER_TEMP/package"
      - name: Publish through npm trusted publishing
        if: steps.release.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$RUNNER_TEMP/package" --provenance --access public --tag "$DIST_TAG"
      - name: Upload the validated release notes
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.release-tag }}
      PRERELEASE: ${{ needs.publish.outputs.prerelease }}
    steps:
      - name: Download the validated release notes
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file "$notes" --prerelease="$PRERELEASE"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file "$notes" --verify-tag --prerelease="$PRERELEASE"
          fi
