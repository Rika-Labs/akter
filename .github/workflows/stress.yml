name: Stress
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Suite runs under CPU load
        default: "10"
permissions:
  contents: read
concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          RUNS: ${{ inputs.runs || '10' }}
        run: |
          case "$RUNS" in
            ''|*[!0-9]*|????*)
              echo "RUNS must be an integer from 1 to 25" >&2
              exit 2
              ;;
          esac
          RUNS=$((10#$RUNS))
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 25 ]; then
            echo "RUNS must be an integer from 1 to 25" >&2
            exit 2
          fi
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
          echo "matrix={\"run\":[$(seq -s, 1 "$RUNS")]}" >> "$GITHUB_OUTPUT"
  stress:
    name: Stress run ${{ matrix.run }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: ${{ matrix.run == 1 }}
      - run: sudo apt-get update -q && sudo apt-get install -yq stress-ng
      - name: Start the streaming replica
        run: echo "TEST_REPLICA_DATABASE_URL=$(bun .github/src/replica.ts)" >> "$GITHUB_ENV"
      # Timing-sensitive cases flake under load long before they do on an idle
      # runner, so every run shares its own machine with one busy worker per core.
      # Each run owns a runner, so the runs no longer share a clock or a database.
      - name: Run the conformance suites under CPU load
        timeout-minutes: 75
        env:
          RUN: ${{ matrix.run }}
        working-directory: packages/akter
        run: |
          set -u
          mkdir -p ../../stress
          stress-ng --cpu "$(nproc)" --timeout 0 --quiet &
          trap 'kill %1' EXIT
          failed=0
          # Each suite is one Vitest command, so the reporter flags reach the run they name.
          # The migration crash file walks hundreds of sequential kill points, so it runs
          # as a suite of its own, as Verify gives it a job no other file competes with.
          while read -r suite script projects; do
            name="$suite-$RUN"
            status=0
            # A hung run is cut off and reported instead of eating the budget.
            # Vitest resolves the report path from the repository root.
            timeout --kill-after=30s 35m bun run "$script" $projects --reporter=default --reporter=json \
              --outputFile.json="stress/$name.json" \
              > "../../stress/$name.log" 2>&1 || status=$?
            echo "$status" > "../../stress/$name.status"
            echo "run $RUN $suite exited $status"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done <<'SUITES'
          test test
          test-integration-postgres test:integration:postgres --project=!integration:migrations
          test-integration-migrations test:integration:postgres --project=integration:migrations
          test-integration-drills test:integration:drills
          SUITES
          exit "$failed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stress-part-${{ matrix.run }}
          path: stress/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  report:
    name: Report failing cases by name
    needs: [plan, stress]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: stress-part-*
          merge-multiple: true
          path: stress
      - name: Report failing cases by name
        env:
          STRESS_DIR: stress
          STRESS_RUNS: ${{ needs.plan.outputs.runs }}
          STRESS_SUITES: test test-integration-postgres test-integration-migrations test-integration-drills
        run: bun .github/src/stress-summary.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stress-${{ github.run_id }}
          path: stress/
          overwrite: true
          retention-days: 14
      - name: Every stress run must have finished
        if: needs.stress.result != 'success'
        run: |
          echo "A stress run did not succeed" >&2
          exit 1
