name: Relay soak
on:
  push:
    branches: [ci/611-faster-ci]
    paths: [.github/workflows/relay-soak.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  soak:
    name: relay ${{ matrix.mode }} ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [alone, shared]
        rep: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
      PROJECTS: ${{ matrix.mode == 'alone' && '--project=postgres:relay' || '--project=!integration --project=!integration:migrations --project=!postgres:effect-control --project=!postgres:heap --project=!postgres:conformance --project=!postgres:capacity --project=!postgres:fleet --project=!postgres:multi-runner --project=!postgres:drain --project=!postgres:cron --project=!postgres:replica --project=!postgres:properties --project=!postgres:subscriptions --project=!postgres:transports --project=!postgres:connections --project=!postgres:simulation --project=!postgres:workflows' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start the streaming replica
        run: echo "TEST_REPLICA_DATABASE_URL=$(bun .github/src/replica.ts)" >> "$GITHUB_ENV"
      - name: Conformance
        run: bun run --cwd packages/akter test:integration:postgres $PROJECTS
