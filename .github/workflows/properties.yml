name: Nightly properties
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: properties-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  properties:
    name: Random-seed unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The failure message names the drawn seed; rerun with PROPERTY_SEED=<seed>.
      PROPERTY_SEED: random
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      - name: Framework unit cases
        run: bun run --cwd packages/akter test
      - name: Conformance suites
        run: bun run --cwd tooling/conformance test
