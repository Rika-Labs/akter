name: Nightly properties
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: properties-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  properties:
    name: Random-seed ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit and PGlite suites
            script: test
          - name: Postgres suite
            script: test:integration
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The failure message names the drawn seed; rerun with PROPERTY_SEED=<seed>.
      PROPERTY_SEED: random
      TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      - run: bun run --filter @rikalabs/akter ${{ matrix.script }}
  simulation:
    name: Deterministic simulation, 2,500 seeds, shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Seeds come from this workflow's run number, which scheduled and manual runs
      # both advance, so every run covers 10,000 seeds no earlier run did, split into
      # four ranges of 2,500, and logs where its range starts. A failure names its
      # seed; rerun it locally with SIMULATION_SEEDS=1 SIMULATION_SEED_BASE=<seed>.
      - name: Simulate
        run: |
          export SIMULATION_SEED_BASE=$(( GITHUB_RUN_NUMBER * 10000 + MATRIX_SHARD * 2500 ))
          echo "Seeds from $SIMULATION_SEED_BASE"
          bun --bun node_modules/vitest/vitest.mjs run packages/akter/src/testing/simulate.test.ts --testTimeout=0 -t "exactly once"
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
          SIMULATION_SEEDS: "2500"
