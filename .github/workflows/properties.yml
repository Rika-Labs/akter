name: Nightly properties
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: properties-${{ github.ref }}
  cancel-in-progress: true
jobs:
  properties:
    name: Random-seed properties
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The failure message names the drawn seed; rerun with PROPERTY_SEED=<seed>.
      PROPERTY_SEED: random
      TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Restore Bun package cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run prepare
      - name: Unit and PGlite suites
        run: bun run --filter @durable-actors/core test
      - name: Postgres suite
        run: bun run --filter @durable-actors/core test:integration
  simulation:
    name: Deterministic simulation, 10,000 seeds
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - name: Restore Bun package cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run prepare
      # Seeds come from this workflow's run number, which scheduled and manual runs
      # both advance, so every run covers 10,000 seeds no earlier run did and logs
      # where they start. A failure names its seed; rerun it locally with
      # SIMULATION_SEEDS=1 SIMULATION_SEED_BASE=<seed>.
      - name: Simulate
        run: |
          export SIMULATION_SEED_BASE=$(( GITHUB_RUN_NUMBER * 10000 ))
          echo "Seeds from $SIMULATION_SEED_BASE"
          bun --bun node_modules/vitest/vitest.mjs run packages/durable-actors/src/testing/simulate.test.ts --testTimeout=0 -t "exactly once"
        env:
          SIMULATION_SEEDS: "10000"
