name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      # oxlint's CLI runs on Node; Node < 24 cannot load the .ts JS plugins.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: Restore Bun package cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
      - name: Restore incremental typecheck state
        uses: actions/cache@v6.1.0
        with:
          path: |
            apps/*/.cache/typecheck.tsbuildinfo
            packages/*/.cache/typecheck.tsbuildinfo
            examples/*/.cache/typecheck.tsbuildinfo
            tooling/*/.cache/typecheck.tsbuildinfo
            infra/.cache/typecheck.tsbuildinfo
          key: types-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'tsconfig.json', '**/tsconfig.json') }}-${{ github.sha }}
          restore-keys: types-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'tsconfig.json', '**/tsconfig.json') }}-
      - name: Set up Turborepo Remote Cache
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Read-your-writes cases need a physical streaming replica of the service
      # primary: allow replication connections, then clone it and follow it.
      - name: Start a streaming replica
        env:
          PRIMARY: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PRIMARY" bash -c 'echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"'
          docker exec "$PRIMARY" psql -U project -d postgres -c 'SELECT pg_reload_conf()'
          docker run -d --name replica --network host --user postgres -e PGPASSWORD=project postgres:18.6 \
            bash -c 'pg_basebackup -h 127.0.0.1 -p 5432 -U project -D /tmp/replica -R -X stream && chmod 700 /tmp/replica && exec postgres -D /tmp/replica -p 5433 -c listen_addresses=127.0.0.1'
          for _ in $(seq 60); do
            if docker exec replica pg_isready -h 127.0.0.1 -p 5433 -U project -d postgres; then exit 0; fi
            sleep 1
          done
          docker logs replica
          exit 1
      - name: Verify and record executable evidence
        id: verify
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GOMAXPROCS: "1"
          TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
          TEST_REPLICA_DATABASE_URL: postgres://project:project@127.0.0.1:5433/postgres
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/sha.txt
          test "$(cat evidence/sha.txt)" = "$HEAD_SHA"
          bun run prepare
          if [[ -n "$BASE_SHA" ]]; then
            export TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD="$HEAD_SHA"
            bun run check:ci --affected 2>&1 | tee evidence/check.log
          else
            bun run check:ci 2>&1 | tee evidence/check.log
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always() && steps.verify.outcome != 'skipped'
        with:
          name: evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/
            .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
