name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
defaults:
  run:
    shell: bash
jobs:
  # Pull requests from forks run on GitHub-hosted runners, so untrusted code never
  # reaches the Namespace account or its cache volumes; everything else runs on Namespace.
  changes:
    name: changes
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'namespace-profile-akter' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      runner: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'namespace-profile-akter' }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      # The test suites are skipped only when a pull request changes nothing but
      # documentation, or when a push to main has the exact tree a pull request
      # already verified; static and pack checks always run.
      - name: Decide whether the test suites run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          suites=true
          reason="the change touches code"
          docs_only() { [ -n "$1" ] && ! grep -qvE '^docs/|\.md$' <<<"$1"; }
          case "$EVENT" in
            pull_request)
              files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL/files?per_page=100" --jq '.[].filename')"
              if [ "$(grep -c . <<<"$files")" -lt 3000 ] && docs_only "$files"; then suites=false; reason="only documentation changed"; fi
              ;;
            push)
              pull="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')"
              if [ -n "$pull" ]; then
                head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull" --jq .head.sha)"
                tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)"
                if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)" = "$tree" ]; then
                  run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" \
                    --jq '.workflow_runs[0].html_url // empty')"
                  if [ -n "$run" ]; then suites=false; reason="pull request #$pull passed Verify on this exact tree ($run)"; fi
                fi
              fi
              if [ "$suites" = true ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD_SHA" --jq 'if (.files | length) < 300 then .files[].filename else empty end' || true)"
                if docs_only "$files"; then suites=false; reason="only documentation changed"; fi
              fi
              ;;
          esac
          echo "Test suites run: $suites ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  self-host:
    name: self-host-recipe
    needs: [changes, static]
    if: needs.changes.outputs.suites == 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Build and boot both self-host runtime images
        run: |
          mkdir -p evidence/self-host
          for runtime in bun node; do
            SELFHOST_RUNTIME="$runtime" bash apps/self-host/verify.sh 2>&1 | tee "evidence/self-host/$runtime.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: self-host-recipe-${{ env.HEAD_SHA }}
          path: evidence/self-host/
          if-no-files-found: error
          retention-days: 14

  static:
    name: static
    needs: changes
    runs-on: ${{ needs.changes.outputs.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOMAXPROCS: "1"
      TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
      SUITES: ${{ needs.changes.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
          typecheck-cache: "true"
      - name: Lint, structure, format, typecheck
        run: |
          mkdir -p evidence/static
          affected=()
          if [[ -n "$BASE_SHA" ]]; then
            export TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD="$HEAD_SHA"
            affected=(--affected)
          fi
          {
            bun run check:static
            bun run turbo run lint lint:root typecheck --concurrency=100% --summarize "${affected[@]}"
          } 2>&1 | tee evidence/static/check.log
      - name: Pack check and tarball smoke on Node and Bun
        run: |
          mkdir -p evidence/pack
          bun run check:pack 2>&1 | tee evidence/pack/check.log
      - name: Start the streaming replica
        if: env.SUITES == 'true'
        run: echo "TEST_REPLICA_DATABASE_URL=$(bun .github/src/replica.ts)" >> "$GITHUB_ENV"
      # Builds replay from the Turborepo cache; tests always execute, because a
      # required check must not pass on a replayed test result.
      - name: Build and test public clients, CLI and tooling
        if: env.SUITES == 'true'
        run: |
          mkdir -p evidence/workspaces
          affected=()
          if [[ -n "$BASE_SHA" ]]; then
            export TURBO_SCM_BASE="$BASE_SHA" TURBO_SCM_HEAD="$HEAD_SHA"
            affected=(--affected)
          fi
          {
            bun run turbo run build --filter='!@rikalabs/akter' --concurrency=100% --summarize "${affected[@]}"
            bun run turbo run test test:integration --filter='!@rikalabs/akter' \
              --only --force --concurrency=100% --summarize "${affected[@]}"
          } 2>&1 | tee evidence/workspaces/check.log
      - name: Collect Turbo run summaries
        if: always()
        run: |
          mkdir -p evidence/static/turbo
          cp .turbo/runs/*.json evidence/static/turbo/ 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: evidence-part-static
          path: evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # Each job runs its shards one after another; shards that need no replica run
  # first, before the replica restarts the primary with logical WAL.
  suites:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.suites == 'true'
    runs-on: ${{ needs.changes.outputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shards-1
            shards: |
              framework-postgres-2 postgres --project=postgres:conformance --project=postgres:capacity
              framework-postgres-1 postgres --project=postgres:effect-control --project=postgres:heap
              node-units node-units
          - name: shards-2
            shards: |
              framework-postgres-4 postgres-without-replica --project=integration:migrations
              framework-postgres-6 postgres --project=postgres:simulation --project=postgres:workflows
              framework-postgres-9 postgres --project=postgres:relay
          - name: shards-3
            shards: |
              framework-postgres-5 postgres --project=postgres:replica --project=postgres:properties --project=postgres:subscriptions --project=postgres:transports --project=postgres:connections
              framework-postgres-7 postgres --project=!integration --project=!integration:migrations --project=!postgres:effect-control --project=!postgres:heap --project=!postgres:conformance --project=!postgres:capacity --project=!postgres:fleet --project=!postgres:multi-runner --project=!postgres:drain --project=!postgres:cron --project=!postgres:replica --project=!postgres:properties --project=!postgres:subscriptions --project=!postgres:transports --project=!postgres:connections --project=!postgres:simulation --project=!postgres:workflows --project=!postgres:relay
              framework-postgres-3 postgres --project=postgres:fleet --project=postgres:multi-runner --project=postgres:drain --project=postgres:cron
              framework-postgres-8 postgres --project=integration
          - name: shards-4
            shards: |
              node-conformance-2 node --project=postgres:conformance --project=postgres:capacity
              node-conformance-4 node --project=postgres:replica --project=postgres:properties --project=postgres:subscriptions --project=postgres:transports --project=postgres:connections
              node-conformance-1 node --project=postgres:effect-control --project=postgres:heap
          - name: shards-5
            shards: |
              node-conformance-5 node --project=postgres:simulation --project=postgres:workflows
              node-conformance-6 node --project=!postgres:effect-control --project=!postgres:heap --project=!postgres:conformance --project=!postgres:capacity --project=!postgres:fleet --project=!postgres:multi-runner --project=!postgres:drain --project=!postgres:cron --project=!postgres:replica --project=!postgres:properties --project=!postgres:subscriptions --project=!postgres:transports --project=!postgres:connections --project=!postgres:simulation --project=!postgres:workflows --project=!postgres:relay
              node-conformance-7 node --project=postgres:relay
          - name: shards-6
            shards: |
              framework-pglite-1 pglite --project=pglite:conformance --project=pglite:workflows --project=pglite:cron
              framework-pglite-3 pglite --project=!pglite:conformance --project=!pglite:workflows --project=!pglite:cron --project=!pglite:properties --project=!pglite:capacity --project=!pglite:transports
              framework-pglite-2 pglite --project=pglite:properties --project=pglite:capacity --project=pglite:transports
          - name: shards-7
            shards: |
              framework-drills drills
              framework-unit unit
              node-conformance-3 node --project=postgres:fleet --project=postgres:multi-runner --project=postgres:drain --project=postgres:cron
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: project
          POSTGRES_PASSWORD: project
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://project:project@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the shards of ${{ matrix.name }}
        env:
          SHARDS: ${{ matrix.shards }}
        run: |
          set -uo pipefail
          failed=()
          while read -r -u 3 name kind rest; do
            [ -n "$name" ] || continue
            read -r -a projects <<<"$rest"
            mkdir -p "evidence/$name"
            if [[ "$kind" =~ ^(postgres|node|node-units)$ ]] && [ -z "${TEST_REPLICA_DATABASE_URL:-}" ]; then
              if ! TEST_REPLICA_DATABASE_URL="$(bun .github/src/replica.ts 2>"evidence/$name/check.log")"; then
                cat "evidence/$name/check.log"
                echo "$name did not start: the streaming replica failed" | tee -a "evidence/$name/check.log" "$GITHUB_STEP_SUMMARY"
                failed+=("$name")
                continue
              fi
              export TEST_REPLICA_DATABASE_URL
            fi
            echo "::group::$name"
            started=$SECONDS
            case "$kind" in
              unit)
                env -u TEST_DATABASE_URL -u TEST_REPLICA_DATABASE_URL \
                  bun run --cwd packages/akter test --exclude '**/conformance/pglite/backend.test.ts' ;;
              pglite)
                env -u TEST_DATABASE_URL -u TEST_REPLICA_DATABASE_URL \
                  bun run --cwd packages/akter test:pglite "${projects[@]}" ;;
              drills)
                env -u TEST_REPLICA_DATABASE_URL bun run --cwd packages/akter test:integration:drills ;;
              postgres-without-replica)
                env -u TEST_REPLICA_DATABASE_URL bun run --cwd packages/akter test:integration:postgres "${projects[@]}" ;;
              postgres)
                bun run --cwd packages/akter test:integration:postgres "${projects[@]}" ;;
              node)
                bun run test:node:conformance "${projects[@]}" ;;
              node-units)
                bun run test:node:units ;;
              *)
                echo "Unknown shard kind $kind"; false ;;
            esac 2>&1 | tee "evidence/$name/check.log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "$name exited $status after $((SECONDS - started))s" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$status" -eq 0 ] || failed+=("$name")
          done 3<<<"$SHARDS"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed shards: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: evidence-part-${{ matrix.name }}
          path: evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  verify:
    name: verify
    needs:
      - changes
      - static
      - suites
    if: always()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'namespace-profile-akter' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Record the verified commit and each job's result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/sha.txt
          test "$(cat evidence/sha.txt)" = "$HEAD_SHA"
          printf '%s\n' "$NEEDS" > evidence/jobs.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always()
        with:
          pattern: evidence-part-*
          merge-multiple: true
          path: evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: evidence-${{ env.HEAD_SHA }}
          path: evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Every verification job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SUITES: ${{ needs.changes.outputs.suites }}
        run: |
          jq -e --arg suites "$SUITES" '
            .changes.result == "success" and .static.result == "success" and
            (.suites.result == "success" or (.suites.result == "skipped" and $suites == "false"))
          ' <<<"$NEEDS" || { echo "A verification job did not succeed" >&2; exit 1; }
