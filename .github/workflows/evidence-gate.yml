name: Evidence gate
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write
jobs:
  evidence:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: namespace-profile-akter;overrides.cache-tag=akter-trusted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          cache: bun
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Evaluate trusted policy without executing or extracting PR artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/src/evidence-gate.ts
