name: protected-release-preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    # npm trusted publishing must use a supported hosted runner, not assumed Blacksmith support.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bun run check
      - run: bun run check:packages
      # Publication intentionally omitted. Configure scope ownership, OIDC trust,
      # license/security contacts and packed consumer gates before adding npm publish.
