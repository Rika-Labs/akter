name: future-chaos-gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance-not-yet-implemented:
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/not-implemented.mjs chaos-conformance
