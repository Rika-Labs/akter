services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: project
      POSTGRES_PASSWORD: project
      POSTGRES_DB: project
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project -d project"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres18:
