services:
  postgres:
    image: postgres:18.6-bookworm
    # pg_stat_statements lets the benchmark harness count statements per
    # operation against this server; the shared memory matches its own container.
    # Fleet views decode the WAL, so it is logical.
    command:
      ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "wal_level=logical"]
    shm_size: 1g
    environment:
      POSTGRES_USER: project
      POSTGRES_PASSWORD: project
      POSTGRES_DB: project
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project -d project"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres18:
