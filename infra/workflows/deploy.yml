name: Deploy an Akter application

on:
  workflow_call:
    inputs:
      api-origin:
        type: string
        required: true
      project-id:
        type: string
        required: true
      environment:
        type: string
        default: production
      registry:
        type: string
        default: registry.fly.io
      repository:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
    secrets:
      AKTER_API_KEY:
        required: true
      FLY_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: akter-${{ inputs.project-id }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - name: Build and push an immutable amd64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.repository }}:${{ github.sha }}
      - name: Register the build and start its rollout
        env:
          API_ORIGIN: ${{ inputs.api-origin }}
          PROJECT_ID: ${{ inputs.project-id }}
          ENVIRONMENT: ${{ inputs.environment }}
          AKTER_API_KEY: ${{ secrets.AKTER_API_KEY }}
          IMAGE: ${{ inputs.registry }}/${{ inputs.repository }}@${{ steps.image.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          create=$(jq -n --arg environment "$ENVIRONMENT" --arg commitSha "$COMMIT_SHA" '{environment: $environment, commitSha: $commitSha}')
          response=$(curl --fail-with-body --silent --show-error -H "x-api-key: $AKTER_API_KEY" -H 'content-type: application/json' --data "$create" "$API_ORIGIN/api/projects/$PROJECT_ID/deployments")
          deployment_id=$(jq -er '.id' <<< "$response")
          build=$(jq -n --arg image "$IMAGE" --arg commitSha "$COMMIT_SHA" '{image: $image, commitSha: $commitSha, environmentSnapshot: {}}')
          curl --fail-with-body --silent --show-error -H "x-api-key: $AKTER_API_KEY" -H 'content-type: application/json' --data "$build" "$API_ORIGIN/api/projects/$PROJECT_ID/deployments/$deployment_id/build"
