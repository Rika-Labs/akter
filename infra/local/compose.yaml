services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: project
      POSTGRES_PASSWORD: project
      POSTGRES_DB: project
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PG_PORT:-55431}:5432"
    volumes:
      - control-plane:/var/lib/postgresql
    command:
      ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project -d project"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      CONTROL_PLANE_DATABASE_URL: postgres://project:project@postgres:5432/project
      AUTH_SECRET: local-development-only-change-before-production
      API_ORIGIN: ${API_ORIGIN:-http://localhost:3001}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:5173}
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      EMAIL_MODE: local
      BILLING_MODE: local
      EDGE_ORIGIN: http://edge:3002
      DEPLOYMENT_DOMAIN: localhost
      RUNNER_PORT: "8080"
      RUNNER_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-akter-local}_default
      RUNNER_ROUTE_VIA_NETWORK: "true"
      RUNNER_MIGRATION_COMMAND: '["bun","infra/local/runner/migrate.ts"]'
      RUNNER_ENVIRONMENT: '{"DATABASE_URL":"postgres://project:project@postgres:5432/local_app","ASSERTION_ISSUER":"http://edge:3002","ASSERTION_KEYS_URL":"http://api:3001/edge/keys"}'
      RUNNER_BUILD_CONTEXT: /source
      RUNNER_BUILD_DOCKERFILE: infra/local/runner/Dockerfile
      RUNNER_PEER_AUTHORITY_DIR: /var/lib/akter/runner-authority
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-3001}:3001"
    volumes:
      - ../../apps/api/src:/workspace/apps/api/src:ro
      - ../../packages/cloud-api/src:/workspace/packages/cloud-api/src:ro
      - ../../packages/billing/src:/workspace/packages/billing/src:ro
      - ../../packages/metering/src:/workspace/packages/metering/src:ro
      - ../../packages/deployments/src:/workspace/packages/deployments/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/source:ro
      - runner-authority:/var/lib/akter/runner-authority
    depends_on:
      postgres:
        condition: service_healthy
      application-database:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "bun", "-e", "fetch('http://localhost:3001/ready').then(r=>process.exit(r.ok?0:1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  email-outbox:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["bun", "--watch", "apps/api/src/outbox.ts"]
    environment:
      CONTROL_PLANE_DATABASE_URL: postgres://project:project@postgres:5432/project
      OUTBOX_PORT: "3003"
      OUTBOX_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${OUTBOX_HTTP_PORT:-3003}:3003"
    volumes:
      - ../../apps/api/src:/workspace/apps/api/src:ro
    depends_on:
      api:
        condition: service_healthy
  application-database:
    image: postgres:18.6-bookworm
    entrypoint: ["sh", "-c"]
    command:
      - psql -h postgres -U project -d project -Atc "SELECT 1 FROM pg_database WHERE datname = 'local_app'" | grep -q 1 || psql -h postgres -U project -d project -c 'CREATE DATABASE local_app'
    environment:
      PGPASSWORD: project
    depends_on:
      postgres:
        condition: service_healthy
  edge:
    build:
      context: ../..
      dockerfile: apps/edge/Dockerfile
    environment:
      CONTROL_PLANE_DATABASE_URL: postgres://project:project@postgres:5432/project
      EDGE_ISSUER: http://edge:3002
      EDGE_SIGNING_KEYS: ${EDGE_SIGNING_KEYS:?Generate local signing keys before starting the edge}
      EDGE_PUBLICATION_LEAD: ${EDGE_PUBLICATION_LEAD:-5 minutes}
      HOST: 0.0.0.0
      PORT: "3002"
      EDGE_NLB_ONLY: "false"
    ports:
      - "127.0.0.1:${EDGE_HTTP_PORT:-3002}:3002"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  runner-image:
    profiles: ["images"]
    image: akter-local-runner:dev
    build:
      context: ../..
      dockerfile: infra/local/runner/Dockerfile
volumes:
  control-plane:
  runner-authority:

name: ${COMPOSE_PROJECT_NAME:-akter-local}
