<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter · durable-actors</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body,
      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        align-items: baseline;
        justify-content: space-between;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        color: GrayText;
        font-size: 0.875rem;
        white-space: nowrap;
      }
      .count {
        font-size: 4rem;
        text-align: center;
        margin: 2rem 0;
      }
      .actions {
        display: flex;
        justify-content: center;
      }
      button {
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      [data-testid="notice"] {
        color: #c33;
        min-height: 1.25rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Counter <span data-testid="counter"></span></h1>
      <span class="meta"
        >signed in as <strong data-testid="user"></strong> · feed
        <span data-testid="feed-status">connecting</span></span
      >
    </header>
    <p class="count" data-testid="count">0</p>
    <div class="actions">
      <button type="button" data-testid="increment">+ Increment</button>
    </div>
    <p data-testid="notice"></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
