<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursors · @durable-actors/react</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body,
      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        align-items: baseline;
        justify-content: space-between;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        color: GrayText;
        font-size: 0.875rem;
        white-space: nowrap;
      }
      [data-testid="stage"] {
        position: relative;
        width: 600px;
        height: 360px;
        margin-top: 1rem;
        border: 1px solid #8884;
        border-radius: 0.5rem;
        overflow: hidden;
        cursor: crosshair;
      }
      [data-testid="cursor"] {
        position: absolute;
        width: 0.75rem;
        height: 0.75rem;
        margin: -0.375rem 0 0 -0.375rem;
        border-radius: 50%;
        pointer-events: none;
      }
      [data-testid="cursor"]::after {
        content: attr(data-user);
        position: absolute;
        left: 0.9rem;
        top: 0.5rem;
        font-size: 0.75rem;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/cursors-react.js"></script>
  </body>
</html>
