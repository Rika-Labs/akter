<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat · durable-actors</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        align-items: baseline;
        justify-content: space-between;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        color: GrayText;
        font-size: 0.875rem;
        white-space: nowrap;
      }
      ul {
        list-style: none;
        padding: 0;
        border: 1px solid #8884;
        border-radius: 0.5rem;
        min-height: 3rem;
      }
      li {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #8882;
      }
      li:last-child {
        border-bottom: none;
      }
      form,
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
        align-items: center;
      }
      input {
        flex: 1;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      [data-testid="notice"] {
        color: #c33;
        min-height: 1.25rem;
      }
      [data-testid="typing"] {
        color: GrayText;
        font-style: italic;
        min-height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Room <span data-testid="room"></span></h1>
      <span class="meta"
        >signed in as <strong data-testid="user"></strong> · feed
        <span data-testid="feed-status">connecting</span></span
      >
    </header>
    <ul data-testid="messages"></ul>
    <div data-testid="typing"></div>
    <form data-testid="post">
      <input data-testid="body" placeholder="Say something" autocomplete="off" />
      <button type="submit">Post</button>
    </form>
    <div class="actions">
      <button type="button" data-testid="react">👍 React</button>
      <span>reactions: <strong data-testid="reactions">0</strong></span>
    </div>
    <p data-testid="notice"></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
