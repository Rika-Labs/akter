<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat · @durable-actors/react</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        align-items: baseline;
        justify-content: space-between;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        color: GrayText;
        font-size: 0.875rem;
        white-space: nowrap;
      }
      ul {
        list-style: none;
        padding: 0;
        border: 1px solid #8884;
        border-radius: 0.5rem;
        min-height: 3rem;
      }
      li {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #8882;
      }
      li:last-child {
        border-bottom: none;
      }
      form,
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
        align-items: center;
      }
      input {
        flex: 1;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.5rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      [data-testid="post-status"] {
        color: GrayText;
        min-height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/react.js"></script>
  </body>
</html>
