name: akter-selfhost

x-image: &image
  image: akter-selfhost-${SELFHOST_RUNTIME:-bun}:local
  build:
    context: ../..
    dockerfile: apps/self-host/Dockerfile.${SELFHOST_RUNTIME:-bun}

x-bucket: &bucket
  S3_BUCKET: akter-store
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: project

services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:4b862594d23cb20ae0fbeb93311ed312a5b566ecba2293220b204c89ef3c1fe2
    container_name: akter-selfhost-minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "MINIO_ROOT_PASSWORD=$$(cat /run/secrets/s3-secret-access-key) exec /usr/bin/minio server /data",
      ]
    user: "0"
    environment:
      MINIO_ROOT_USER: project
    secrets: [s3-secret-access-key]
    volumes: [data:/data]
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  bucket:
    <<: *image
    container_name: akter-selfhost-bucket
    command: ["${SELFHOST_RUNTIME:-bun}", "apps/self-host/src/bucket.ts"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment: *bucket
    secrets: [s3-secret-access-key]
    networks: [private]

  runner:
    <<: *image
    container_name: akter-selfhost-runner
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      bucket:
        condition: service_completed_successfully
    environment: *bucket
    ports: ["127.0.0.1:18080:8080"]
    secrets: [api-token, s3-secret-access-key]
    networks: [private]

networks:
  private: {}

volumes:
  data:

secrets:
  api-token:
    file: ${SELFHOST_SECRETS_DIR:?set SELFHOST_SECRETS_DIR}/api-token
  s3-secret-access-key:
    file: ${SELFHOST_SECRETS_DIR}/s3-secret-access-key
