name: akter-selfhost

x-runner: &runner
  image: akter-selfhost-${SELFHOST_RUNTIME:-bun}:local
  build:
    context: ../..
    dockerfile: apps/self-host/Dockerfile.${SELFHOST_RUNTIME:-bun}
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    COMMAND_DELAY_MS: ${COMMAND_DELAY_MS:-0}
  secrets:
    - database-password
    - api-token
    - ca.pem
  networks: [private]

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: akter-selfhost-pg
    environment:
      POSTGRES_USER: project
      POSTGRES_DB: project
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets: [database-password]
    volumes: [data:/var/lib/postgresql]
    ports: ["127.0.0.1:55477:5432"]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U project -d project]
      interval: 2s
      timeout: 3s
      retries: 30

  runner-a:
    <<: *runner
    container_name: akter-selfhost-runner-a
    environment:
      RUNNER_HOST: runner-a
      COMMAND_DELAY_MS: ${COMMAND_DELAY_MS:-0}
    ports: ["127.0.0.1:18081:8080"]
    secrets:
      - database-password
      - api-token
      - ca.pem
      - source: runner-a-certificate
        target: certificate.pem
      - source: runner-a-key
        target: key.pem

  runner-b:
    <<: *runner
    container_name: akter-selfhost-runner-b
    environment:
      RUNNER_HOST: runner-b
      COMMAND_DELAY_MS: ${COMMAND_DELAY_MS:-0}
    ports: ["127.0.0.1:18082:8080"]
    secrets:
      - database-password
      - api-token
      - ca.pem
      - source: runner-b-certificate
        target: certificate.pem
      - source: runner-b-key
        target: key.pem

networks:
  private: {}

volumes:
  data:

secrets:
  database-password:
    file: ${SELFHOST_SECRETS_DIR:?set SELFHOST_SECRETS_DIR}/database-password
  api-token:
    file: ${SELFHOST_SECRETS_DIR}/api-token
  ca.pem:
    file: ${SELFHOST_SECRETS_DIR}/ca.pem
  runner-a-certificate:
    file: ${SELFHOST_SECRETS_DIR}/runner-a.pem
  runner-a-key:
    file: ${SELFHOST_SECRETS_DIR}/runner-a-key.pem
  runner-b-certificate:
    file: ${SELFHOST_SECRETS_DIR}/runner-b.pem
  runner-b-key:
    file: ${SELFHOST_SECRETS_DIR}/runner-b-key.pem
