services:
  postgres:
    command: /usr/lib/postgresql/18/bin/postgres -D .local/postgres18 -h 127.0.0.1 -p "$PORT" -k /tmp
    port: 5432
  console:
    command: bash .agents/start-service console
    port: 3000
    health: /health
    portal:
      title: Durable Actors Console
      description: Local development with captured email and no live billing credentials.
  api:
    command: bash .agents/start-service api
    port: 3001
    health: /health
    env:
      APP_ORIGIN: ${services.console.publicURL}
